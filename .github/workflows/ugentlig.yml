name: Ugentlig teatermonitor

on:
  schedule:
    # Mandag 05:30 UTC = 07:30 dansk sommertid (06:30 om vinteren).
    - cron: "30 5 * * 1"
  workflow_dispatch:
    inputs:
      alt_som_nyt:
        description: "Send HELE listen, ikke kun det nye siden sidst"
        type: boolean
        default: false

# Nødvendigt fordi jobbet skriver hukommelsen (state/set.json) og den
# offentlige side (docs/index.html) tilbage til repoet.
permissions:
  contents: write

concurrency:
  group: teatermonitor
  cancel-in-progress: false

jobs:
  koer:
    runs-on: ubuntu-latest
    # En normal kørsel tager ~15 min (112 kommune/genre-opslag mod Kultunaut
    # plus ~30 spillesteder). Afviser Kultunaut GitHubs IP'er, løber hvert
    # opslag i timeout og retry, og kørslen ville ellers kunne tage timer.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installér afhængigheder
        run: pip install -r requirements.txt

      # Fejler afsendelsen (fx manglende nøgle), skal siden stadig bygges.
      # Trinnet markeres rødt i kørslen, men stopper ikke resten.
      - name: Hent, filtrér og send digest
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          TEATERMONITOR_MODTAGERE: ${{ secrets.TEATERMONITOR_MODTAGERE }}
          TEATERMONITOR_AFSENDER: ${{ secrets.TEATERMONITOR_AFSENDER }}
        # Tom streng ved planlagte kørsler — så sendes kun det nye siden sidst.
        run: python monitor.py ${{ inputs.alt_som_nyt && '--alt-som-nyt' || '' }}

      - name: Byg den offentlige side
        run: |
          python byg_side.py
          mkdir -p docs
          cp udbakke/side.html docs/index.html

      - name: Gem hukommelse og side
        run: |
          git config user.name  "teatermonitor"
          git config user.email "teatermonitor@users.noreply.github.com"
          git add docs/index.html
          # set.json findes kun hvis afsendelsen lykkedes — den er systemets
          # hukommelse om hvad du allerede har set.
          git add state/set.json || true
          if git diff --staged --quiet; then
            echo "Ingen ændringer at gemme."
          else
            git commit -m "Ugentlig opdatering $(date -u +%Y-%m-%d)"
            git push
          fi

      # Afsendelsestrinnet er continue-on-error, saa jobbet taeller som
      # lykkedes selv naar mailen fejler. Derfor ville en if: failure()-
      # betingelse her aldrig udloese, og loggen ville vaere utilgaengelig
      # netop naar den var mest brugbar. Gem den altid.
      - name: Gem logfil som artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teatermonitor-log
          path: state/koersler.log
          if-no-files-found: ignore

      # state/set.json skrives foerst naar afsendelsen er lykkedes, og er
      # derfor den paalidelige indikator for om mailen faktisk gik ud.
      - name: Opsummer resultat
        if: always()
        run: |
          if [ -f state/set.json ]; then
            echo "### Mailen blev sendt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Mailen blev IKKE sendt" >> "$GITHUB_STEP_SUMMARY"
            echo "Siden er opdateret, men afsendelsen fejlede." >> "$GITHUB_STEP_SUMMARY"
            echo "Hent artefakten \`teatermonitor-log\` for aarsagen." >> "$GITHUB_STEP_SUMMARY"
          fi
